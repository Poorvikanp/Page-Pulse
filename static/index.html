<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Pulse — quick URL audit</title>
<style>
  :root {
    --ink: #10201c;
    --muted: #6b7c78;
    --line: #dde5e2;
    --accent: #0d7a5f;
    --accent-dark: #085943;
    --bg: #f4f7f6;
    --card: #ffffff;
    --good: #0d7a5f;
    --warn: #b45309;
    --bad: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px;
    width: 100%;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 4px;
    letter-spacing: -0.02em;
  }
  h1 .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    vertical-align: middle;
  }
  p.tagline {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 32px;
  }
  form {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 15px;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    padding: 12px 20px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button:hover:not(:disabled) { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .status-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 13px;
  }
  .status-badge.ok { background: #e6f4ef; color: var(--good); }
  .status-badge.warn { background: #fdf2e3; color: var(--warn); }
  .status-badge.bad { background: #fbe9e9; color: var(--bad); }
  #report-actions {
    display: none;
    margin-top: 10px;
    text-align: right;
  }
  #copy-json-btn {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 6px 12px;
    font-size: 13px;
  }
  #copy-json-btn:hover:not(:disabled) { background: #e6f4ef; }
  #copy-json-btn.copied { border-color: var(--good); color: var(--good); }
  #status-line { margin-top: 12px; font-size: 14px; color: var(--muted); min-height: 20px; }
  #error-box {
    display: none;
    margin-top: 20px;
    padding: 14px 16px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: var(--bad);
    border-radius: 8px;
    font-size: 14px;
  }
  #report {
    display: none;
    margin-top: 28px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .row:last-child { border-bottom: none; }
  .row .label { color: var(--muted); }
  .row .value { font-weight: 600; text-align: right; max-width: 60%; word-break: break-word; }
  footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--muted);
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1><span class="dot"></span>Page Pulse</h1>
  <p class="tagline">Drop in a URL. Get its vitals back in a second.</p>

  <form id="audit-form">
    <input type="text" id="url-input" placeholder="https://example.com" autocomplete="off" />
    <button type="submit" id="submit-btn">Audit</button>
  </form>
  <div id="status-line"></div>
  <div id="error-box"></div>

  <div id="report"></div>
  <div id="report-actions">
    <button id="copy-json-btn" type="button">Copy report as JSON</button>
  </div>
</main>

<footer>
  Built for Digital Heroes Training Task — <a href="https://digitalheroesco.com" target="_blank" rel="noopener">digitalheroesco.com</a>
</footer>

<script>
  const form = document.getElementById("audit-form");
  const urlInput = document.getElementById("url-input");
  const submitBtn = document.getElementById("submit-btn");
  const statusLine = document.getElementById("status-line");
  const errorBox = document.getElementById("error-box");
  const reportEl = document.getElementById("report");
  const reportActions = document.getElementById("report-actions");
  const copyJsonBtn = document.getElementById("copy-json-btn");

  let lastReport = null;

  function resetUI() {
    errorBox.style.display = "none";
    reportEl.style.display = "none";
    reportActions.style.display = "none";
    copyJsonBtn.classList.remove("copied");
    copyJsonBtn.textContent = "Copy report as JSON";
    statusLine.textContent = "";
  }

  function row(label, value) {
    return `<div class="row"><span class="label">${label}</span><span class="value">${value}</span></div>`;
  }

  function statusBadge(status) {
    let cls = "bad";
    if (status >= 200 && status < 300) cls = "ok";
    else if (status >= 300 && status < 400) cls = "warn";
    return `<span class="status-badge ${cls}">${status}</span>`;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    resetUI();
    const url = urlInput.value.trim();
    if (!url) return;

    submitBtn.disabled = true;
    statusLine.textContent = "Fetching and analyzing…";

    try {
      const res = await fetch("/audit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      const data = await res.json();

      if (!res.ok || data.error) {
        errorBox.textContent = data.error || "Something went wrong auditing that URL.";
        errorBox.style.display = "block";
        statusLine.textContent = "";
        return;
      }

      statusLine.textContent = "";
      lastReport = data;
      reportEl.innerHTML =
        row("URL", data.url) +
        row("HTTP status", statusBadge(data.status)) +
        row("Response time", data.response_time_ms + " ms") +
        row("Title", data.title || "<em>none found</em>") +
        row("Meta description", data.meta_description || "<em>none found</em>") +
        row("H1 count", data.h1_count) +
        row("Images missing alt text", data.images_missing_alt) +
        row("Approx. word count", data.word_count);
      reportEl.style.display = "block";
      reportActions.style.display = "block";
    } catch (err) {
      errorBox.textContent = "Network error — could not reach the audit service.";
      errorBox.style.display = "block";
    } finally {
      submitBtn.disabled = false;
    }
  });

  copyJsonBtn.addEventListener("click", async () => {
    if (!lastReport) return;
    try {
      await navigator.clipboard.writeText(JSON.stringify(lastReport, null, 2));
      copyJsonBtn.textContent = "Copied ✓";
      copyJsonBtn.classList.add("copied");
      setTimeout(() => {
        copyJsonBtn.textContent = "Copy report as JSON";
        copyJsonBtn.classList.remove("copied");
      }, 1500);
    } catch (err) {
      copyJsonBtn.textContent = "Couldn't copy";
    }
  });
</script>
</body>
</html>
